app = "xiquet-backend"
primary_region = "cdg"  # Paris - closest available to Catalonia (Madrid deprecated)

[build]
  dockerfile = "../docker/Dockerfile.backend"

# Run migrations automatically on deploy (before app starts)
[deploy]
  release_command = "python migrations/run_migration.py"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # Set this to true to save money
  auto_start_machines = true
  min_machines_running = 1  # Set this to 0 to save money

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # Lightweight - no local ML models, uses OpenAI API

