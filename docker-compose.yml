services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - huggingface_cache:/root/.cache/huggingface  # Cache ML models between restarts
      - ./docker-compose.yml:/docker-compose.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - SCRAPER_HEADLESS=true
      - COMPOSE_FILE=/docker-compose.yml
      - COMPOSE_PROJECT_NAME=castellers
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - flaresolverr
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
    restart: unless-stopped

  # Event scraper uses host networking so Cloudflare/Turnstile see the Mac IP
  # (Docker bridge IPs are blocked). Triggered via docker compose run from the API.
  scraper:
    profiles: ["scraper"]
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    network_mode: host
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - SCRAPER_HEADLESS=false
      - FLARESOLVERR_URL=
    command: sleep infinity

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_SUPABASE_URL=${SUPABASE_URL:-}
      - REACT_APP_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - REACT_APP_API_URL=http://localhost:8000
    command: npm start

volumes:
  huggingface_cache:  # Persists ML models between container restarts